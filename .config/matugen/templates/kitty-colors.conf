url_color {{colors.primary.default.hex}}


# =========================================================
# ANSI NORMAL
#
# Use bright Material roles here as well.
# This keeps shell output, paths, filenames and commands
# clearly visible instead of blending into the background.
# =========================================================

# Black
color0 {{colors.on_surface_variant.default.hex}}

# Red — errors
color1 {{colors.error.default.hex}}

# Green — success / secondary
color2 {{colors.secondary.default.hex}}

# Yellow — warning / tertiary
color3 {{colors.tertiary.default.hex}}

# Blue — primary
color4 {{colors.primary.default.hex}}

# Magenta — tertiary
color5 {{colors.tertiary.default.hex}}

# Cyan — secondary
color6 {{colors.secondary.default.hex}}

# White — normal foreground
color7 {{colors.on_surface.default.hex}}


# =========================================================
# ANSI BRIGHT
#
# Maximum contrast variants.
# =========================================================

# Bright black — muted but readable
color8 {{colors.outline.default.hex}}

# Bright red — strong error
color9 {{colors.on_error_container.default.hex}}

# Bright green — strong success
color10 {{colors.on_secondary_container.default.hex}}

# Bright yellow — strong warning
color11 {{colors.on_tertiary_container.default.hex}}

# Bright blue — strong primary
color12 {{colors.on_primary_container.default.hex}}

# Bright magenta — strong tertiary
color13 {{colors.tertiary.default.hex}}

# Bright cyan — strong secondary
color14 {{colors.secondary.default.hex}}

# Bright white — maximum neutral contrast
color15 {{colors.on_surface.default.hex}}

