
# =========================================================
# Kitty — Material 3 / Matugen
# High-visibility ANSI palette
# =========================================================

# ---------------------------------------------------------
# Base
# ---------------------------------------------------------

foreground #dee3e6
background #0f1416

selection_foreground #003641
selection_background #85d2e8

cursor #85d2e8
cursor_text_color #003641

url_color #85d2e8


# =========================================================
# ANSI NORMAL
#
# Use bright Material roles here as well.
# This keeps shell output, paths, filenames and commands
# clearly visible instead of blending into the background.
# =========================================================

# Black
color0 #bfc8cb

# Red — errors
color1 #ffb4ab

# Green — success / secondary
color2 #b2cbd3

# Yellow — warning / tertiary
color3 #bfc4eb

# Blue — primary
color4 #85d2e8

# Magenta — tertiary
color5 #bfc4eb

# Cyan — secondary
color6 #b2cbd3

# White — normal foreground
color7 #dee3e6


# =========================================================
# ANSI BRIGHT
#
# Maximum contrast variants.
# =========================================================

# Bright black — muted but readable
color8 #899295

# Bright red — strong error
color9 #ffdad6

# Bright green — strong success
color10 #cee7ef

# Bright yellow — strong warning
color11 #dee0ff

# Bright blue — strong primary
color12 #aeecff

# Bright magenta — strong tertiary
color13 #bfc4eb

# Bright cyan — strong secondary
color14 #b2cbd3

# Bright white — maximum neutral contrast
color15 #dee3e6

